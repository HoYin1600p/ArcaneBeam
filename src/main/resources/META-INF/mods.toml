license = "MIT"
loaderVersion = "[40,)"
modLoader = "javafml"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
updateJSONURL = "https://raw.githubusercontent.com/HoYin1600p/ArcaneBeam/main/update.json"
authors = "hoyin1600p"
description = '''
Replaces Vault Hunters Arcane and Arcane Rail particle streams with clean rendered beams.
'''

[modproperties."${mod_id}"]
hoyinUpdateNotifier = true
hoyinUpdateName = "Arcane Beam"

[[dependencies.${mod_id}]]
mandatory = true
modId = "forge"
ordering = "NONE"
side = "BOTH"
versionRange = "[40,)"

[[dependencies.${mod_id}]]
mandatory = true
modId = "minecraft"
ordering = "NONE"
side = "BOTH"
versionRange = "[1.18.2,1.19)"

[[dependencies.${mod_id}]]
mandatory = true
modId = "the_vault"
ordering = "AFTER"
side = "BOTH"
versionRange = "[0,)"
