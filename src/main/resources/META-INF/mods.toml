license = "MIT"
loaderVersion = "[40,)"
modLoader = "javafml"
issueTrackerURL = "https://github.com/HoYin1600p/ArcaneBeam/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
updateJSONURL = "https://raw.githubusercontent.com/HoYin1600p/ArcaneBeam/main/update.json"
authors = "HoYin1600p"
credits = "Masuary (config menu UI overhaul)"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/arcanebeam"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Client-side replacement visuals and sounds for Vault Hunters abilities, Vault Altar effects and the Mana Stealer trap.

Features: configurable replacement visuals and sounds for abilities, per-profile settings, resource-pack beam profiles
with an Arcane resource-pack particle mode, Mana Stealer trap visuals, a dungeon globe map overlay tweak, and an
in-game config screen.
'''

[modproperties."${mod_id}"]
hoyinUpdateNotifier = true
hoyinUpdateName = "Arcane Beam"

[[dependencies.${mod_id}]]
mandatory = true
modId = "forge"
ordering = "NONE"
side = "BOTH"
# 40.1.67 is the first 1.18.2 build with RenderLevelStageEvent, which every effect renderer uses.
versionRange = "[40.1.67,)"

[[dependencies.${mod_id}]]
mandatory = true
modId = "minecraft"
ordering = "NONE"
side = "BOTH"
versionRange = "[1.18.2,1.19)"

[[dependencies.${mod_id}]]
mandatory = true
modId = "the_vault"
ordering = "AFTER"
side = "BOTH"
# Oldest tested build is Wolds 1.18.2-3.21.6.x; Remastered 1.18.2-20.0.x and anything newer also satisfies it.
versionRange = "[1.18.2-3.21.6,)"
