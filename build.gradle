plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'java'
}

apply plugin: 'org.spongepowered.mixin'

group = project.group_name
version = project.mod_version

java {
    archivesBaseName = "${archives_base_name}-${minecraft_version}"
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}-${minecraft_version}"
}

repositories {
    mavenCentral()
    flatDir {
        dirs "reference"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// The reference Vault jar is not in git (reference/ is ignored). Without it the build compiles against the
// CurseForge file named by vault_hunters_version, which can be a different Vault build, so say so loudly.
// Pass -PrequireVaultReference to turn that into a failure (for example on a release build).
def localVaultJar = file("reference/the_vault-1.18.2-${vault_hunters_local_version}.jar")
def vaultCompileSource = localVaultJar.exists()
        ? "local reference jar ${localVaultJar.name}"
        : "CurseForge file ${vault_hunters_version} (reference/${localVaultJar.name} is missing)"
if (!localVaultJar.exists()) {
    if (project.hasProperty('requireVaultReference')) {
        throw new GradleException("reference/${localVaultJar.name} is missing and -PrequireVaultReference was given. "
                + "Copy the Vault Hunters jar named vault_hunters_local_version into reference/.")
    }
    logger.warn("WARNING: compiling against ${vaultCompileSource}, not the Vault build the mod is tested with. "
            + "Put ${localVaultJar.name} in reference/ for a faithful build.")
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf(localVaultJar.exists()
            ? "local.thevault:the_vault-1.18.2:${vault_hunters_local_version}"
            : "curse.maven:vault-hunters-official-mod-458203:${vault_hunters_version}")
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.mana_stealer.mixins.json"
}

processResources {
    inputs.property "version", project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name
    }
}

jar {
    from('LICENSE') {
        into('META-INF')
    }
    manifest {
        attributes([
                "Specification-Title": "${mod_id}",
                "Specification-Vendor": "HoYin1600p",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "HoYin1600p",
                "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.mana_stealer.mixins.json"
        ])
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    doFirst {
        logger.lifecycle("Vault Hunters compile reference: ${vaultCompileSource}")
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
